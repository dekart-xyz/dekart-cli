[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dekart"
version = "0.16.0"
description = "Dekart CLI for auth, MCP tool discovery, calls, and file upload flows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{name = "Dekart XYZ"}]
dependencies = [
  "duckdb==1.4.3; python_version >= '3.9'",
  "duckdb==1.2.2; python_version < '3.9'",
]

[project.scripts]
dekart = "dekart.cli:main"

[tool.hatch.build.targets.wheel]
include = [
  "/dekart/**",
]
